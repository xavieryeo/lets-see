name: Desktop foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Desktop / linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Toolchain versions and native host target
        id: toolchain
        run: |
          node -v
          pnpm -v
          rustc -vV
          cargo -V
          rustc -vV | grep -Fx "host: x86_64-unknown-linux-gnu"
      - name: Resolve missing Cargo lockfile
        id: cargo_lock
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated Cargo lockfile for review
        if: ${{ !cancelled() && steps.cargo_lock.outputs.generated == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-lockfiles-linux-x64
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native desktop executable build
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features tauri/custom-protocol
      - name: Upload unsigned desktop test executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lets-see-desktop-test-linux-x64
          path: src-tauri/target/release/lets-see
          if-no-files-found: error
      - name: Require committed lockfiles before acceptance
        if: always()
        run: |
          git ls-files --error-unmatch pnpm-lock.yaml src-tauri/Cargo.lock
          git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
